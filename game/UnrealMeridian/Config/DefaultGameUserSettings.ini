; The player's settings before they change any (Options saves theirs in Saved/Config/.../GameUserSettings.ini).
; Lighting at Medium: Lumen's cheaper final gather and screen-space reflections look nearly the same as Epic
; for about 35-50% less GPU time (docs/performance.md "Lighting and grass options").
[ScalabilityGroups]
sg.GlobalIlluminationQuality=1
sg.ReflectionQuality=1

; Vertical sync, with no frame limit of its own: frames as fast as the display shows them, evenly paced. A limit
; alone (the 60 until 2026-10-13) sleeps the game without lining frames up with the display, which judders on a
; 120-165 Hz screen; uncapped, the faster settings drive the CPU hard enough to stall now and then. Options >
; Graphics still offers 30, 60, 120, 144, Uncapped and vsync off (docs/performance.md "Packaged game"). Settings
; saved before this get it once (MRSettings ApplyNewDefaults).
[/Script/Engine.GameUserSettings]
bUseVSync=True
FrameRateLimit=0.000000
