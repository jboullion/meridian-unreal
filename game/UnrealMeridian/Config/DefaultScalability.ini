; The project's changes to the engine's quality levels (BaseScalability.ini), per group and level.
; Why each one: docs/performance.md.

; TSR's history at 200% of the screen (the engine's Epic) cost ~0.5 GB of video memory at 1080p and
; part of TSR's 1.7 ms, for a sharpness hardly seen at our textures' scale; High's 100% everywhere
[AntiAliasingQuality@3]
r.TSR.History.ScreenPercentage=100

; Volumetric clouds (the engine's m_SimpleVolumetricCloud): the engine traces up to 768 samples a ray, with
; shadow rays of up to 80, so under a thick sky the cloud pass took 25-55 ms (and the sky light's capture
; of it up to 30 ms) on an RTX 3070. The cost follows the samples actually taken, which only drop below
; ~96: capped per level, and empty space stepped over faster. With the 4 km layer (moods.json "Clouds").
[EffectsQuality@0]
r.VolumetricCloud.ViewRaySampleMaxCount=24
r.VolumetricCloud.ReflectionRaySampleMaxCount=12
r.VolumetricCloud.Shadow.ViewRaySampleMaxCount=4
r.VolumetricCloud.Shadow.ReflectionRaySampleMaxCount=2
r.VolumetricCloud.StepSizeOnZeroConservativeDensity=4

[EffectsQuality@1]
r.VolumetricCloud.ViewRaySampleMaxCount=32
r.VolumetricCloud.ReflectionRaySampleMaxCount=16
r.VolumetricCloud.Shadow.ViewRaySampleMaxCount=8
r.VolumetricCloud.Shadow.ReflectionRaySampleMaxCount=4
r.VolumetricCloud.StepSizeOnZeroConservativeDensity=4

[EffectsQuality@2]
r.VolumetricCloud.ViewRaySampleMaxCount=40
r.VolumetricCloud.ReflectionRaySampleMaxCount=24
r.VolumetricCloud.Shadow.ViewRaySampleMaxCount=12
r.VolumetricCloud.Shadow.ReflectionRaySampleMaxCount=6
r.VolumetricCloud.StepSizeOnZeroConservativeDensity=3

[EffectsQuality@3]
r.VolumetricCloud.ViewRaySampleMaxCount=48
r.VolumetricCloud.ReflectionRaySampleMaxCount=32
r.VolumetricCloud.Shadow.ViewRaySampleMaxCount=16
r.VolumetricCloud.Shadow.ReflectionRaySampleMaxCount=8
r.VolumetricCloud.StepSizeOnZeroConservativeDensity=2
